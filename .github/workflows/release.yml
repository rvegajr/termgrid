name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.2). Must exist on the repo."
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
          - label: macOS (Intel)
            platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles app,dmg
          - label: Linux x86_64
            platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            args: --bundles deb,rpm,appimage
          - label: Windows x86_64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --bundles msi,nsis

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - run: pnpm install --frozen-lockfile

      # Conditionally inject signing/notarization env vars only when their
      # secrets are non-empty. Empty secrets become empty env vars, which
      # tauri-action interprets as "signing requested" → import fails. See
      # RELEASING.md for the full secret list and how to populate them.
      - name: Configure signing env (only if secrets present)
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -e
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            val="${!v}"
            if [ -n "$val" ]; then
              # Multi-line safe write to GITHUB_ENV
              {
                echo "${v}<<TG_EOF"
                printf '%s\n' "$val"
                echo "TG_EOF"
              } >> "$GITHUB_ENV"
              echo "set $v"
            fi
          done

      - name: Tauri build (direct)
        shell: bash
        run: pnpm tauri build ${{ matrix.args }}

      - name: Ensure GitHub Release exists
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -e
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "TermGrid $TAG" \
              --notes "Built artifacts attached. See CHANGELOG.md for details." \
              --draft
          fi

      - name: Upload bundles to Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -e
          shopt -s nullglob globstar
          base="src-tauri/target"
          # Possible bundle dirs across platforms + targets
          patterns=(
            "$base/release/bundle/deb/"*.deb
            "$base/release/bundle/rpm/"*.rpm
            "$base/release/bundle/appimage/"*.AppImage
            "$base/release/bundle/msi/"*.msi
            "$base/release/bundle/nsis/"*.exe
            "$base/"*"/release/bundle/dmg/"*.dmg
            "$base/"*"/release/bundle/macos/"*.app.tar.gz
          )
          uploaded=0
          for f in "${patterns[@]}"; do
            if [ -f "$f" ]; then
              echo "↑ uploading $f"
              gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY" --clobber
              uploaded=$((uploaded+1))
            fi
          done
          if [ "$uploaded" -eq 0 ]; then
            echo "::warning::no artifacts found to upload — bundle paths may have changed"
            ls -R "$base/release/bundle" || true
            ls -R "$base"/*/release/bundle 2>/dev/null || true
          else
            echo "uploaded $uploaded artifact(s)"
          fi

  publish-updater-manifest:
    name: Publish updater manifest
    needs: build
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref_name, '-') }}
    steps:
      - uses: actions/checkout@v6
      - name: Generate latest.json
        run: |
          # Placeholder: once the updater plugin is enabled, this step will read
          # the signed artifacts from the Release and emit a latest.json that
          # the running app fetches via tauri-plugin-updater. See RELEASING.md.
          echo "TODO: emit latest.json against ${{ github.ref_name }}"
