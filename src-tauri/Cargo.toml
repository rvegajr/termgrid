[package]
name = "termgrid"
version = "0.1.7"
description = "The best terminal multiplexer"
authors = ["you"]
edition = "2021"

[lib]
name = "termgrid_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-deep-link = "2.4.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
portable-pty = "0.8"
rusqlite = { version = "0.40", features = ["bundled", "modern_sqlite"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
dirs-next = "2"
# Cross-platform process enumeration for session adoption.
sysinfo = { version = "0.32", default-features = false, features = ["system"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Memory",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Wdk_System_Threading",
    "Wdk_Foundation",
] }
# tauri-plugin-updater + tauri-plugin-process: removed for v0.1.x.
# Re-add when generating a Tauri signing keypair — see RELEASING.md §3.

[dev-dependencies]
mockall = "0.13"
tempfile = "3"

[profile.release]
# Optimize for size and startup time
lto = true
codegen-units = 1
strip = true
panic = "abort"
