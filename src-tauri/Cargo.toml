[package]
name = "termgrid"
version = "0.1.2"
description = "The best terminal multiplexer"
authors = ["you"]
edition = "2021"

[lib]
name = "termgrid_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
portable-pty = "0.8"
rusqlite = { version = "0.32", features = ["bundled", "modern_sqlite"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
dirs-next = "2"
tauri-plugin-deep-link = "2.4.9"
# tauri-plugin-updater + tauri-plugin-process: removed for v0.1.x.
# Re-add when generating a Tauri signing keypair — see RELEASING.md §3.

[dev-dependencies]
mockall = "0.13"
tempfile = "3"

[profile.release]
# Optimize for size and startup time
lto = true
codegen-units = 1
strip = true
panic = "abort"
